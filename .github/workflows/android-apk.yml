name: Crear APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses >/dev/null
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK de instalacion
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: cumpleanos-beingolea-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
